name: Verify
on:
  pull_request:
  push:
    branches: [main, design/mvp-foundation]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Run tests (Testcontainers with runner Docker)
        run: gradle --no-daemon test
